<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドミニオン デッキ引き切り確率計算機</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:auto;padding:24px;line-height:1.6}fieldset{margin:16px 0;padding:16px}label{display:block;margin:8px 0}input{width:8rem;padding:6px}button{padding:8px 16px}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{border:1px solid #bbb;padding:6px;text-align:right}.error{color:#a00}.note{background:#f4f4f4;padding:12px}</style>
</head><body><h1>ドミニオン デッキ引き切り確率計算機</h1>
<p class="note">厳密計算。初期手札5枚、アクション回数制限なし、捨て札・再シャッフル・獲得・持続・村効果なし。カード順は一様ランダムと仮定します。</p>
<fieldset><legend>単一計算</legend>
<label>デッキ枚数 <input id="deck" type="number" min="0" max="200" value="20"></label>
<div id="drawInputs"></div><button id="calculate">厳密確率を計算</button>
<p id="result" aria-live="polite"></p></fieldset>
<fieldset><legend>研究所（+2ドロー）確率表</legend>
<label>最大デッキ枚数 <input id="maxDeck" type="number" min="10" max="80" value="30"></label>
<label>最大研究所枚数 <input id="maxLabs" type="number" min="0" max="40" value="13"></label>
<button id="tableButton">表を生成（最大1,000セル）</button><div id="table"></div></fieldset>
<script type="module">
import {exactDrawProbability} from "./probability.js";
const drawInputs=document.querySelector("#drawInputs");
for(let d=1;d<=5;d++){const label=document.createElement("label");label.textContent=`+${d}ドローカード枚数 `;const input=document.createElement("input");input.type="number";input.min="0";input.max="200";input.value=d===2?"8":"0";input.id=`draw${d}`;label.append(input);drawInputs.append(label);}
const value=id=>Number(document.querySelector(id).value);
const counts=()=>[1,2,3,4,5].map(d=>value(`#draw${d}`));
function showError(target,error){target.className="error";target.textContent=error.message;}
document.querySelector("#calculate").onclick=()=>{const out=document.querySelector("#result");try{const p=exactDrawProbability(value("#deck"),counts());out.className="";out.textContent=`引き切り確率: ${(p*100).toFixed(6)}%`; }catch(e){showError(out,e);}};
document.querySelector("#tableButton").onclick=()=>{const root=document.querySelector("#table");try{const maxDeck=value("#maxDeck"),maxLabs=value("#maxLabs");if(!Number.isInteger(maxDeck)||maxDeck<10||maxDeck>80||!Number.isInteger(maxLabs)||maxLabs<0||maxLabs>40)throw new RangeError("表の範囲が不正です");const cells=(maxDeck-9)*(maxLabs+1);if(cells>1000)throw new RangeError("表は1,000セル以下にしてください");let html="<table><thead><tr><th>デッキ</th>";for(let l=0;l<=maxLabs;l++)html+=`<th>${l}枚</th>`;html+="</tr></thead><tbody>";for(let n=10;n<=maxDeck;n++){html+=`<tr><th>${n}</th>`;for(let l=0;l<=maxLabs;l++){html+=l>n?"<td>—</td>":`<td>${(exactDrawProbability(n,[0,l,0,0,0])*100).toFixed(2)}%</td>`;}html+="</tr>";}root.className="";root.innerHTML=html+"</tbody></table>";}catch(e){root.innerHTML="";showError(root,e);}};
document.querySelector("#calculate").click();
</script></body></html>
